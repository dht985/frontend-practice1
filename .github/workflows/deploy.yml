name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies for Morandi Chat
        working-directory: ./morandi-chat
        run: npm ci

      - name: Run unit & integration tests for Morandi Chat
        working-directory: ./morandi-chat
        run: npm test

      - name: Build Morandi Chat
        working-directory: ./morandi-chat
        run: npm run build

      - name: Copy build output to root
        run: |
          mkdir -p dist/morandi-chat
          cp -r morandi-chat/dist/* dist/morandi-chat/

      - name: Copy other projects
        run: |
          cp bootstrap.html dist/
          cp -r tianjin dist/
          cp -r css dist/
          cp -r lib dist/
          cp index.html dist/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
